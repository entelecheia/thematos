# Train one LDA model: load -> build corpus -> train -> summarize -> plot.
# hyfi run workflow=thematos_lda dataset.data_file=<corpus.parquet> [dataset.text_col=tokens] [model.model_args.k=20]
# Artifacts go to ${model.output_dir} (default: <workspace>/topic/model).
defaults:
  - /dataset@_global_.dataset: topic_corpus
  - /model@_global_.model: lda

name: thematos_lda
steps:
  - run: thematos.datasets.corpus.read_dataframe
    with:
      path: ${dataset.data_file}
  - run: thematos.steps.build_corpus
    with:
      corpus: ${dataset}
  - run: thematos.steps.train
    with:
      model: ${model}
  - run: thematos.steps.summarize
  - run: thematos.steps.plot
