# A corpus for topic models. Pass the documents with dataset.data_file=<.parquet|.csv|.jsonl>.
defaults:
  - /stopwords@stopwords: default # lexikanon
  - _self_

_target_: thematos.datasets.Corpus
data_file: null
id_col: id
text_col: text
ngramize: true
ngrams:
  min_cf: 20
  min_df: 10
  max_len: 5
  max_cand: 5000
  min_score: 0.5
  normalized: true
  workers: 0
  delimiter: _
verbose: false
