defaults:
  - /words@wordprior: wordprior
  - /plot@wc_args: wordcloud
  - _self_

_target_: thematos.models.LdaModel
output_dir: ${project.workspace}/topic/model
name: model
model_type: LDA
seed: null # null draws a random seed; set one to reproduce a run
num_workers: 1 # 0 uses every core; results then depend on the machine
model_args:
  tw: 1 # tomotopy.TermWeight.IDF
  min_cf: 5
  min_df: 0
  rm_top: 0
  k: 10
  alpha: 0.1
  eta: 0.01
train_args:
  burn_in: 0
  interval: 10
  iterations: 100
train_summary_args:
  initial_hp: true
  params: true
  topic_word_top_n: 10
  flush: false
coherence_metric_list: [u_mass, c_uci, c_npmi, c_v]
eval_coherence: true
set_wordprior: false
save_full: true
verbose: false
