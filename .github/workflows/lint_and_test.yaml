---
name: lint & test

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to validate (the release workflow passes refs/tags/<tag> on a republish)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["*.md", "docs/**", "mkdocs.yaml", ".github/workflows/docs.yaml"]

permissions:
  contents: read

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  # One build per commit: a main push whose tree equals a PR head that already
  # passed this workflow skips the matrix (workspace CI standard, maru `decision`).
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_full: ${{ steps.dedupe.outputs.run_full }}
    steps:
      - id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # PRs touching only these paths skip validation but still report ci-ok.
          DOCS_ONLY_RE: '^([^/]*\.md|docs/.*|mkdocs\.yaml|\.github/workflows/docs\.yaml)$'
        run: |
          set -uo pipefail
          run_full=true
          reason="this event requires full validation"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Both sides of a rename count: moving code into docs/ still validates.
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')
            other=$(printf '%s\n' "$files" | grep -Ev "$DOCS_ONLY_RE" || true)
            # The files API stops at 3000 entries; a PR that large always validates.
            changed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .changed_files || echo 3000)
            if [ -n "$files" ] && [ -z "$other" ] && [ "${changed:-3000}" -lt 3000 ]; then
              run_full=false
              reason="docs-only change"
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            reason="no successful pull request run for the same tree"
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")] | last | .head.sha // empty" 2>/dev/null)
            if [ -n "$pr" ]; then
              push_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
              head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$pr" --jq .tree.sha)
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lint_and_test.yaml/runs?event=pull_request&head_sha=$pr&status=completed" \
                --jq '[.workflow_runs[]] | sort_by(.run_started_at) | last | .conclusion // ""')
              if [ "$push_tree" = "$head_tree" ] && [ "$conclusion" = "success" ]; then
                run_full=false
                reason="PR head $pr passed on the identical tree $push_tree"
              fi
            fi
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "decision: $reason" | tee -a "$GITHUB_STEP_SUMMARY"

  quality:
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1" # pin the uv CLI; bump with uv.lock-affecting changes
          python-version: "3.13"
          enable-cache: true
          cache-python: true
      - run: make lint

  test:
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # tomotopy and fugashi (via lexikanon) are native extensions: cover macOS at the support edges.
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.15" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1" # pin the uv CLI; bump with uv.lock-affecting changes
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-python: true
      # fugashi 1.5.2 (lexikanon -> ekonlpy) ships no cp315 wheel; its source build needs MeCab.
      - name: Install MeCab (fugashi source build)
        if: matrix.python-version == '3.15'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q libmecab-dev
          else
            brew install mecab
          fi
      - run: uv sync --no-default-groups --group test
      - run: uv run --no-sync pytest --cov --cov-report=term-missing
      - name: Installed wheel runs the example workflow outside the checkout
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          uv build
          wheel="$(ls "$PWD"/dist/*.whl)"
          data="$PWD/tests/assets/sample_data/train.parquet"
          uv export --no-default-groups --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          cd "$RUNNER_TEMP"
          run=(uv run --isolated --no-project --with-requirements requirements.txt --with "$wheel")
          "${run[@]}" hyfi plugins
          "${run[@]}" hyfi run workflow=thematos_lda dataset.data_file="$data" dataset.text_col=tokens \
            model.model_args.k=5 model.train_args.iterations=20 model.seed=42
          ls workspace/topic/model/*.mdl .hyfi/runs/*/manifest.json

  dependency-bounds:
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    name: deps pre-release (hydra 1.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LOCKED: "0" # this job resolves on purpose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1" # pin the uv CLI; bump with uv.lock-affecting changes
          python-version: "3.14"
          enable-cache: true
          cache-python: true
      - run: uv run --isolated --prerelease if-necessary-or-explicit --with 'hydra-core>=1.4.0rc1' --no-default-groups --group test python -c "import hydra; print(hydra.__version__)"
      - run: uv run --isolated --prerelease if-necessary-or-explicit --with 'hydra-core>=1.4.0rc1' --no-default-groups --group test pytest -q

  # Single required check that is green whether the matrix ran or was deduplicated.
  ci-ok:
    if: always()
    needs: [decision, quality, test, dependency-bounds]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -Eq '"(failure|cancelled)"' && exit 1 || exit 0
