[project]
name = "thematos"
version = "0.14.5"
description = "LDA topic modeling on tomotopy, with HyFI 2.0 config groups and workflows"
authors = [{ name = "Young Joon Lee", email = "entelecheia@hotmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["topic-modeling", "lda", "tomotopy", "nlp", "hyfi"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "hyfi>=2,<3",
    "lexikanon",
    "matplotlib>=3.7",
    "numpy>=1.23.5",
    "pandas>=2",
    "pillow>=9",
    "pyarrow>=14",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tomotopy>=0.14",
    "wordcloud>=1.9.4",
]

[project.urls]
Homepage = "https://thematos.entelecheia.ai"
Repository = "https://github.com/entelecheia/thematos"
Documentation = "https://thematos.entelecheia.ai"
Changelog = "https://github.com/entelecheia/thematos/blob/main/CHANGELOG.md"

[project.entry-points."hyfi.plugins"]
thematos = "thematos.conf"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.15", "mypy>=1.13", "types-PyYAML", "pandas-stubs"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "docs" }]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
lexikanon = { git = "https://github.com/entelecheia/lexikanon", branch = "feat/118-hyfi-2-migration" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thematos"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
files = ["src/thematos"]
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["thematos"]

[tool.coverage.report]
fail_under = 85
skip_empty = true
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'if __name__ == "__main__":']

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = true
version_source = "tag"
commit_message = ":rocket: {version}\n\nAutomatically generated by python-semantic-release"
# Keep uv.lock in step with the bumped version, or `uv lock --locked` fails after a release.
# One && chain: PSR runs this with `sh -c` and no `-e`, so a failing step must stop the build.
build_command = "pip install uv==0.13.1 && uv lock --upgrade-package \"$PACKAGE_NAME\" && git add uv.lock && uv build"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/thematos/_version.py:__version__"]

[tool.semantic_release.branches.main]
match = "release"
prerelease = false

[tool.semantic_release.changelog]
insertion_flag = "<!--next-version-placeholder-->"
mode = "update"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
